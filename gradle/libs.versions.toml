# NOTE: This file is not wired into the build (settings.gradle.kts declares no versionCatalogs,
# and no module references `libs.`). `EngHub_Win/build.gradle.kts` is the single source of truth for
# versions. This catalog is kept only as a reference and therefore mirrors the real values below.
#
# It previously held a copy of the Android app's catalog (Kotlin 2.3.20, AGP, media3, NewPipe, ...),
# which described a build this project does not have.

[versions]
kotlin = "2.1.21"
compose = "1.8.2"
coroutines = "1.10.1"
jlayer = "1.0.1"
okhttp = "4.12.0"
sqliteJdbc = "3.47.1.0"
json = "20240303"
commonsCompress = "1.27.1"
pdfbox = "2.0.32"
newpipe = "v0.26.5"
junit = "4.13.2"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
jlayer = { group = "javazoom", name = "jlayer", version.ref = "jlayer" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
json = { group = "org.json", name = "json", version.ref = "json" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
pdfbox = { group = "org.apache.pdfbox", name = "pdfbox", version.ref = "pdfbox" }
newpipe-extractor = { group = "com.github.TeamNewPipe", name = "NewPipeExtractor", version.ref = "newpipe" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

