name: Build and Release EngHub Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew || true
        shell: bash

      - name: Run Unit Tests
        run: ./gradlew.bat test

      - name: Build Windows Distributable & UberJar
        run: ./gradlew.bat createDistributable packageMsi

      - name: Collect release files
        run: |
          $version = (Select-String -Path build.gradle.kts -Pattern 'val appVersion = "([^"]+)"').Matches[0].Groups[1].Value
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Compress-Archive -Path "build/compose/binaries/main/app/EngHub/*" -DestinationPath "EngHub-windows-x64-$version.zip"
          $msi = Get-ChildItem -Path build/compose/binaries/main/msi -Filter *.msi | Select-Object -First 1
          Copy-Item -Path $msi.FullName -Destination "EngHub-windows-x64-$version.msi"
          # Release body = only the newest section of RELEASE_NOTES.md.
          $n = 0; $out = @()
          foreach ($line in Get-Content RELEASE_NOTES.md) { if ($line -like '## *') { $n++ }; if ($n -eq 1) { $out += $line } }
          Set-Content -Path release-notes.md -Value $out -Encoding utf8
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          # A push to main releases v<appVersion> (like the Android app); pushing the same version again replaces its files.
          tag_name: v${{ env.APP_VERSION }}
          name: EngHub for Windows v${{ env.APP_VERSION }}
          files: |
            EngHub-windows-x64-*.msi
            EngHub-windows-x64-*.zip
          body_path: release-notes.md
