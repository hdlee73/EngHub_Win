name: CI (build and launch test)

on:
  pull_request:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Unit tests
        run: ./gradlew.bat test --no-daemon

  windows-launch:
    name: windows-launch (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The ARM64 build is reported but does not block the PR while it is new.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-latest, java-arch: x64 }
          - { arch: arm64, os: windows-11-arm, java-arch: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: ${{ matrix.java-arch }}

      - name: Ensure WiX Toolset (needed for MSI / EXE installers)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe")) {
            Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile wix.zip
            Expand-Archive wix.zip -DestinationPath "$HOME/wix"
            "$HOME/wix" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Build Windows app image
        run: ./gradlew.bat createDistributable --no-daemon

      - name: Launch EngHub.exe and check it stays up
        shell: pwsh
        run: |
          $exe = "build/compose/binaries/main/app/EngHub/EngHub.exe"
          Remove-Item "$HOME/EngHub_crash.log" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("launch.png")
          # Print a small copy of the screenshot into the log so it can be read without downloading the artifact.
          $w = [int]($b.Width / 2); $h = [int]($b.Height / 2)
          $small = New-Object System.Drawing.Bitmap $w, $h
          $g = [System.Drawing.Graphics]::FromImage($small)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.DrawImage($bmp, 0, 0, $w, $h)
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq "image/jpeg" }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 70L
          $ms = New-Object System.IO.MemoryStream
          $small.Save($ms, $codec, $ep)
          $b64 = [Convert]::ToBase64String($ms.ToArray())
          Write-Host "SCREENSHOT_BEGIN"
          for ($i = 0; $i -lt $b64.Length; $i += 3000) { Write-Host $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i)) }
          Write-Host "SCREENSHOT_END"
          if (Test-Path "$HOME/EngHub_crash.log") { Write-Host "=== EngHub_crash.log ==="; Get-Content "$HOME/EngHub_crash.log" }
          if ($p.HasExited) { Write-Host "EngHub.exe exited early with code $($p.ExitCode)"; exit 1 }
          Write-Host "EngHub.exe is still running after 30s: launch OK"
          Stop-Process -Id $p.Id -Force

      - name: Upload launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-screenshot-${{ matrix.arch }}
          path: launch.png
          if-no-files-found: ignore

      - name: Build MSI and EXE installers (packaging check)
        run: ./gradlew.bat packageMsi packageExe --no-daemon

      - name: Zip test build
        shell: pwsh
        run: Compress-Archive -Path "build/compose/binaries/main/app/EngHub/*" -DestinationPath "EngHub-windows-${{ matrix.arch }}-test.zip"

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: EngHub-windows-${{ matrix.arch }}-test
          path: EngHub-windows-${{ matrix.arch }}-test.zip
